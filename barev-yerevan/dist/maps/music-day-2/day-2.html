<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#F8F3E0">
  <title>Музыка — звук · Карта второго дня</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="map.css">
</head>
<body>
  <main class="map-shell" aria-label="Карта музыкального маршрута по Еревану">
    <div id="map" aria-label="Интерактивная карта. Масштаб меняется кнопками плюс и минус; карта перемещается стрелками." tabindex="0"></div>
    <div class="map-top">
      <div class="day-label"><span class="day-number">02</span><span>Музыка <span class="separator">/</span> звук</span></div>
      <button class="stops-toggle" id="stops-toggle" aria-label="Остановки маршрута: 3" aria-expanded="false" aria-controls="stops-panel"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5h10M7 10h10M7 15h10M2 5h1M2 10h1M2 15h1"/></svg><span>Остановки</span><span class="count">3</span></button>
    </div>
    <nav id="stops-panel" class="stops-panel" aria-label="Остановки маршрута" hidden>
      <div class="panel-heading"><span>По порядку маршрута</span><button id="close-list" class="icon-button" aria-label="Закрыть список остановок">×</button></div>
      <ol id="stops-list"></ol>
    </nav>
    <div class="map-actions" aria-label="Управление картой">
      <button id="zoom-in" title="Приблизить" aria-label="Приблизить">+</button>
      <button id="zoom-out" title="Отдалить" aria-label="Отдалить">−</button>
      <button id="fit" class="fit-button" title="Показать весь маршрут" aria-label="Показать весь маршрут"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button>
    </div>
    <div class="map-legend" aria-label="Условные обозначения"><span><i class="line walk"></i>Пешком</span><span><i class="line transfer"></i>Трансфер</span></div>
    <div id="loading" role="status">Загружаем карту…</div>
    <p id="error" role="alert" hidden>Не удалось загрузить карту. Откройте страницу через локальный сервер по инструкции из комплекта.</p>
  </main>
  <script src="vendor/leaflet.js"></script>
  <script src="data/base.js?v=expanded-20261016"></script>
  <script src="data/day-2.js"></script>
  <script src="popup-hover.js?v=20261016"></script>
  <script src="map.js?v=expanded-20261016"></script>
</body>
</html>
